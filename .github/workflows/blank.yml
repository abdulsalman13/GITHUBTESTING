name: This Is my First Github Actions

on:
  push:
    branches: ["main"]

jobs:
  display-job:
    runs-on: ubuntu-latest
    steps:
      - name: Print My name
        run: echo "Hello Github Actions"

  install-job:
    runs-on: ubuntu-latest
    steps:
      - name: Installing tree
        runs: |
          sudo apt update
          sudo apt install tree -y

  final-job:
    runs-on: ubuntu-latest
    needs:
      - display-job
      - install-job
    steps:
      - name: Show success message
        run: echo "Both jobs finished successfully"
